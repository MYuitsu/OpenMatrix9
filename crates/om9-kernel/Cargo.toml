[package]
name = "om9-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OCCT 8.0.1 bridge: one C ABI of complete operations per capability, promoted from the M00 gate proof"

[features]
# Optional 3DM ON_Brep <-> OCCT conversion. Requires the pinned openNURBS static
# library in addition to the OCCT SDK.
3dm-brep = []

[build-dependencies]
cc = "1"

[dependencies]
om9-core = { path = "../om9-core" }
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The 3DM conversion symbols live behind the `3dm-brep` feature; a test binary that links the
# whole crate needs it enabled.
[[test]]
name = "star_pyramid"
required-features = ["3dm-brep"]

[[test]]
name = "gem_brep"
required-features = ["3dm-brep"]
