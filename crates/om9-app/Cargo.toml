[package]
name = "om9-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[features]
default = ["occt-brep"]
# Optional native BRep fixtures. Viewport rendering always uses the GPU and needs no OCCT runtime.
gpu-sphere = ["dep:om9-kernel"]
# Editable 3DM BRep import through the pinned OCCT 8.0.1 kernel. This is the default
# product build; --no-default-features is a developer fallback that cannot display BReps.
occt-brep = ["dep:om9-kernel", "om9-kernel/3dm-brep"]

[dependencies]
om9-core = { path = "../om9-core" }
om9-command-options = { path = "../om9-command-options" }
om9-sdk = { path = "../om9-sdk" }
om9-plugin-host = { path = "../om9-plugin-host" }
om9-archive = { path = "../om9-archive" }
om9-exchange = { path = "../om9-exchange" }
om9-scene = { path = "../om9-scene" }
om9-native-owner = { path = "../om9-native-owner" }
om9-render = { path = "../om9-render" }
om9-addons = { path = "../om9-addons", features = ["native"] }
om9-addon-abi = { path = "../om9-addon-abi", features = ["session"] }
om9-kernel = { path = "../om9-kernel", optional = true }
serde.workspace = true
skrifa = "=0.44.0"
epaint_default_fonts = "=0.36.2"
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "__screenshot"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "=0.45.1", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"

[[bin]]
name = "om9"
path = "src/main.rs"

[dev-dependencies]
om9-addon-gem-on-curve = { path = "../../addons/gem_on_curve" }
om9-addon-curves = { path = "../../addons/curves", default-features = false }
om9-addon-transform = { path = "../../addons/transform", default-features = false }
om9-addon-gem-cutter = { path = "../../addons/gem_cutter", default-features = false }
om9-addon-matrix = { path = "../../addons/matrix", default-features = false }
