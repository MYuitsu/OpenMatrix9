[package]
name = "om9-native-owner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
om9-core = { path = "../om9-core" }
sha2.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
libc = "=0.2.190"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
wgpu = "=30.0.1"
ash = "=0.38.0"
clipboard-win = "=5.4.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
uuid.workspace = true

[[bin]]
name = "om9-process-fixture"
path = "src/bin/process_fixture.rs"

[[bin]]
name = "om9-native-runner"
path = "src/bin/native_runner.rs"
