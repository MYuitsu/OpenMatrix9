[workspace]
members = ["crates/om9-core", "crates/om9-archive", "crates/om9-app", "crates/om9-scene", "crates/om9-native-owner", "crates/om9-exchange"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
uuid = { version = "=1.23.3", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
