[package]
name = "om9-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[dependencies]
om9-core = { path = "../om9-core" }
om9-archive = { path = "../om9-archive" }
om9-scene = { path = "../om9-scene" }
om9-native-owner = { path = "../om9-native-owner" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "__screenshot"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
resvg = { version = "=0.45.1", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"

[[bin]]
name = "om9"
path = "src/main.rs"

