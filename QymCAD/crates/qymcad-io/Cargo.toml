[package]
name = "qymcad-io"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Import (DXF/SVG/STL/STEP) and project files for QymCAD"

[dependencies]
qymcad-core.workspace = true
ron.workspace = true
dxf = "0.6"
usvg = "0.48"
zip = { version = "8", default-features = false, features = ["deflate"] }
# glTF is JSON; the same version qymcad-update already uses, so nothing new enters the tree
serde_json = "1.0.151"
# STEP with nesting needs OpenCASCADE through the FFI - a block of its own. `truck` was tried and rolled
# back as a dead end: it gives geometry without the assembly hierarchy.

[lints]
workspace = true
