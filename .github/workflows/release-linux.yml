name: Build Linux OM9 all-in-one

on: workflow_call

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit public source
        run: python3 tools/public_source_audit.py
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev uuid-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libvulkan1 mesa-vulkan-drivers patchelf ninja-build xvfb xdotool
      - name: Pin Rust
        run: |
          printf 'CARGO_TARGET_DIR=%s/om9-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
      - name: Check Linux process and file ownership
        run: |
          cargo test --locked -j 2 -p om9-native-owner --test verified_file --test process_owner
          cargo test --locked -j 2 -p om9-archive --test atomic_save
      - name: Identify the C++ toolchain
        id: toolchain
        run: echo "compiler=$(g++ --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned native dependencies
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ci/linux/dependencies
          key: om9-ubuntu-24.04-x64-${{ steps.toolchain.outputs.compiler }}-${{ hashFiles('native/**', 'tools/ci/build-native-unix.sh', 'tools/patches/occt-8.0.1-offset-d3.patch') }}
      - name: Build pinned OCCT and openNURBS
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash tools/ci/build-native-unix.sh
      - name: Save pinned native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ci/linux/dependencies
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build and smoke-test Linux all-in-one
        run: bash tools/ci/build-standalone-linux.sh
      - name: Launch the extracted Linux desktop
        env:
          WGPU_BACKEND: vulkan
        run: |
          app="$GITHUB_WORKSPACE/build/ci/linux/extracted/OpenMatrix9/om9"
          config=$(mktemp -d)
          env -u LD_LIBRARY_PATH -u LD_PRELOAD OM9_CONFIG_DIR="$config" \
            xvfb-run -a bash -euc '
              "$1" &
              pid=$!
              trap "kill $pid 2>/dev/null || true; wait $pid || true" EXIT
              timeout 60 xdotool search --sync --onlyvisible --pid "$pid" .
            ' -- "$app"
      - name: Keep Linux all-in-one
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-linux-x64-all-in-one
          path: build/ci/linux/packages/*
          if-no-files-found: error
          retention-days: 30
