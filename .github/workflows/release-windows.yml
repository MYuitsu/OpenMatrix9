name: Build and release Windows OM9

on:
  push:
    branches: [main, 'codex/release-*', 'codex/gumball-release-*']
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

concurrency:
  group: om9-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit public source before creating the dependency environment
        run: python tools/public_source_audit.py
      - name: Validate release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata=Get-Content release.json -Raw|ConvertFrom-Json
          if($env:GITHUB_REF_NAME -cne ('v'+$metadata.version)){throw 'Release tag does not match source version'}
          git merge-base --is-ancestor HEAD origin/main
          if($LASTEXITCODE -ne 0){throw 'Release commit must be reviewed on main'}
      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if($LASTEXITCODE -ne 0){throw 'Rust installation failed'}
          rustup override set 1.98.1
          if($LASTEXITCODE -ne 0){throw 'Rust override failed'}
      - name: Build standalone Rust OM9, pinned native adapters and portable ZIP
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/om9-target
        run: |
          New-Item -ItemType Directory -Force build/ci/standalone | Out-Null
          Start-Transcript -Path build/ci/standalone/build.log
          try { ./tools/ci/build-standalone-windows.ps1 }
          finally { Stop-Transcript }
      - name: Build add-on packages (Tools > Add-ons > Install from Disk)
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/om9-target
        run: ./tools/ci/build-addons-windows.ps1
      - name: Keep add-on packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-addons
          path: build/ci/standalone/addons/*
          if-no-files-found: error
          retention-days: 30
      - name: Attest ZIP provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/ci/standalone/packages/*.zip
      - name: Keep built release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-release-files
          path: build/ci/standalone/packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Keep build provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-build-evidence
          path: |
            build/ci/standalone/evidence/**
            build/ci/standalone/build-paths.json
            build/ci/standalone/build.log
            build/ci/standalone/occt-offset-d3/*.log
            build/ci/standalone/occt-offset-d3/build-receipt.json
            build/ci/opennurbs-msvc/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 30

  native-exchange:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned openNURBS and the native 3DM reader/writer
        shell: pwsh
        run: ./tools/ci/build-native-exchange.ps1 -OutDir "$env:GITHUB_WORKSPACE/build/ci/native-exchange"
      - name: Keep native exchange binary, manifest and SHA256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-native-exchange
          path: build/ci/native-exchange/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, native-exchange]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the built artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name om9-release-files --dir dist
      - name: Publish immutable release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum --check SHA256SUMS.txt && cd ..
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*-Standalone-Windows-x64.zip' | wc -l)" -eq 1
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "OpenMatrix9 $GITHUB_REF_NAME" --notes "Standalone Rust OM9 for Windows x64 with pinned OCCT/openNURBS adapters. Extract the complete ZIP and run Start-OM9.cmd. CI provenance covers build and payload integrity; UI and geometry acceptance are separate."
