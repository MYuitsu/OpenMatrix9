name: Build and release Windows OM9

on:
  push:
    branches: [main, 'codex/release-*', 'codex/gumball-release-*']
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: om9-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit public source before creating the dependency environment
        run: python tools/public_source_audit.py
      - name: Validate release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata=Get-Content release.json -Raw|ConvertFrom-Json
          if($env:GITHUB_REF_NAME -cne ('v'+$metadata.version)){throw 'Release tag does not match source version'}
          git merge-base --is-ancestor HEAD origin/main
          if($LASTEXITCODE -ne 0){throw 'Release commit must be reviewed on main'}
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: tools/ci/pixi.toml
          locked: true
          activate-environment: true
          cache: true
      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if($LASTEXITCODE -ne 0){throw 'Rust installation failed'}
          rustup override set 1.98.1
          if($LASTEXITCODE -ne 0){throw 'Rust override failed'}
      - name: Compile plugin, Rust core, openNURBS and worker against stock FreeCAD
        shell: pwsh
        run: ./tools/ci/build-windows.ps1
      - name: Record build identity and binary SHA256 (tests run locally)
        shell: pwsh
        run: python tools/ci/record-build.py --root "$env:OM9_CI_ROOT"
      - name: Produce two ZIPs and shared SHA256SUMS
        shell: pwsh
        run: python tools/ci/package_release.py --root "$env:OM9_CI_ROOT" --build-only
      - name: Attest ZIP provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/ci/packages/*.zip
      - name: Keep built release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-release-files
          path: build/ci/packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Keep build provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-build-evidence
          path: |
            build/ci/evidence/**
            build/ci/build-paths.json
            build/ci/runtime/Mod/OpenMatrix9/release-validation.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the built artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name om9-release-files --dir dist
      - name: Publish immutable release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum --check SHA256SUMS.txt && cd ..
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "OpenMatrix9 $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
