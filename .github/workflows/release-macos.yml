name: Build macOS OM9 all-in-one

on:
  push:
    branches: [main, 'codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit public source
        run: python3 tools/public_source_audit.py
      - name: Pin Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
      - name: Check Darwin memory, process and file ownership
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/om9-target
        run: |
          cargo test --locked -j 2 -p om9-native-owner --lib macos_reports_physical_memory
          cargo test --locked -j 2 -p om9-native-owner --test verified_file
          cargo test --locked -j 2 -p om9-native-owner --test process_owner
          cargo test --locked -j 2 -p om9-archive --test atomic_save
      - name: Identify native toolchain
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned native dependencies
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ci/macos/dependencies
          key: om9-macos-15-arm64-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('native/**', 'tools/ci/build-native-macos.sh', 'tools/patches/occt-8.0.1-offset-d3.patch') }}
      - name: Build pinned OCCT and openNURBS
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/om9-target
        run: bash tools/ci/build-standalone-macos.sh --native-only
      - name: Save pinned native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/ci/macos/dependencies
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build and smoke-test Apple Silicon all-in-one
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/om9-target
        run: bash tools/ci/build-standalone-macos.sh --bundle-only
      - name: Keep macOS all-in-one
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: om9-macos-arm64-all-in-one
          path: build/ci/macos/packages/*
          if-no-files-found: error
          retention-days: 30
