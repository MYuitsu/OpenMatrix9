[package]
name = "openmatrix9_rust"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
name = "openmatrix9_rust"
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
