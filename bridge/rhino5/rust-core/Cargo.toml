[package]
name = "om9_rhino_layer"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmatrix9_rust = { path = "../../../rust" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
