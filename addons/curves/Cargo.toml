[package]
name = "om9-addon-curves"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 add-on: Matrix 9 Curve menu commands (Polyline, Circle, Rectangle, Arc …), interactive"
publish = false

[lib]
name = "om9_curves"
crate-type = ["cdylib", "rlib"]

[features]
# Export the C symbols OM9 loads. Off when several add-ons are linked into one test binary.
default = ["export"]
export = []

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
om9-addon-geom = { path = "../geom" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
om9-addons = { path = "../../crates/om9-addons", features = ["native"] }
