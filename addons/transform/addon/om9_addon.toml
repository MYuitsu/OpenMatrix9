# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_transform"
version = "0.1.0"
name = "Transform Tools"
tagline = "Move, Rotate, Mirror, Scale, Array kiểu Matrix 9"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Transform"]

[[commands]]
id = "TopIconMove"
label = "Move"
handler = "om9_addon_session"
interactive = true
aliases = ["Move"]
summary = "Dời vật."
steps = ["Chọn vật.", "Bấm điểm gốc.", "Bấm điểm đích (xem trước khi rê)."]

[[commands]]
id = "TopIconDuplicate"
label = "Duplicate"
handler = "om9_addon_session"
interactive = true
aliases = ["Copy", "Duplicate"]
summary = "Sao chép vật, đặt nhiều bản liên tiếp."
steps = ["Chọn vật.", "Bấm điểm gốc.", "Bấm các điểm đặt bản sao, Enter để kết thúc."]
options = ["InPlace: sao chép tại chỗ."]

[[commands]]
id = "TopIconRotate"
label = "Rotate"
handler = "om9_addon_session"
interactive = true
aliases = ["Rotate"]
summary = "Xoay vật quanh một tâm trong CPlane."
steps = ["Chọn vật.", "Bấm tâm xoay.", "Gõ góc hoặc bấm hai điểm."]
options = ["Copy: giữ bản gốc."]

[[commands]]
id = "TopIconMirror"
label = "Mirror"
handler = "om9_addon_session"
interactive = true
aliases = ["Mirror"]
summary = "Lấy đối xứng vật qua một đường."
steps = ["Chọn vật.", "Bấm hai điểm của đường đối xứng (hoặc XAxis / YAxis)."]
options = ["Copy: giữ bản gốc (mặc định Yes).", "XAxis / YAxis: trục CPlane."]

[[commands]]
id = "TransformRotate3D"
label = "Rotate 3D"
handler = "om9_addon_session"
interactive = true
aliases = ["Rotate3D"]
summary = "Xoay vật quanh một trục 3D."
steps = ["Chọn vật.", "Bấm hai điểm của trục.", "Gõ góc."]
options = ["Copy."]

[[commands]]
id = "TransformScaleScale3D"
label = "Scale 3D"
handler = "om9_addon_session"
interactive = true
aliases = ["Scale"]
summary = "Phóng to/thu nhỏ đều."
steps = ["Chọn vật.", "Bấm điểm gốc.", "Gõ hệ số hoặc bấm hai điểm tham chiếu."]
options = ["Copy."]

[[commands]]
id = "TransformScaleScale2D"
label = "Scale 2D"
handler = "om9_addon_session"
interactive = true
aliases = ["Scale2D"]
summary = "Phóng to/thu nhỏ trong mặt CPlane."
steps = ["Chọn vật.", "Bấm điểm gốc.", "Gõ hệ số."]
options = ["Copy."]

[[commands]]
id = "TransformScaleScale1D"
label = "Scale 1D"
handler = "om9_addon_session"
interactive = true
aliases = ["Scale1D"]
summary = "Phóng to/thu nhỏ theo một hướng."
steps = ["Chọn vật.", "Bấm điểm gốc và hướng.", "Gõ hệ số."]
options = ["Copy."]

[[commands]]
id = "TransformArrayPolar"
label = "Array Polar"
handler = "om9_addon_session"
interactive = true
aliases = ["ArrayPolar"]
summary = "Mảng tròn quanh tâm."
steps = ["Chọn vật.", "Bấm tâm.", "Gõ số lượng và góc."]
options = ["NumberOfItems, Angle."]

[[commands]]
id = "TransformArrayArrayLinear"
label = "Array Linear"
handler = "om9_addon_session"
interactive = true
aliases = ["ArrayLinear"]
summary = "Mảng thẳng hàng."
steps = ["Chọn vật.", "Gõ số lượng.", "Bấm điểm gốc và khoảng cách."]

[[commands]]
id = "TransformArrayRectangular"
label = "Array"
handler = "om9_addon_session"
interactive = true
aliases = ["Array"]
summary = "Mảng lưới chữ nhật."
steps = ["Chọn vật.", "Gõ số theo X, Y, Z.", "Bấm/gõ khoảng cách."]
