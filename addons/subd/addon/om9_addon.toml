[[settings]]
key = "sd_levels"
type = "int"
option = "Levels"
label = "Mức làm mịn khi tạo (0 = lồng)"
default = 0
min = 0
max = 4
commands = ["ClayooCreationPipe", "ClayooPrimitivesBox", "ClayooPrimitivesSphere", "ClayooPrimitivesCylinder", "ClayooPrimitivesCone", "ClayooPrimitivesTorus", "ClayooPrimitivesPlane", "ClayooCreationSweep1Rail", "ClayooCreationSweep2Rails", "ClayooCreationLoft", "ClayooCreationRevolve", "ClayooCreationFromCurve", "ClayooCreationFrom2Curves", "ClayooCreationFromSurface", "ClayooCreationFromTSplines", "ClayooCreationFromMesh", "ClayooCreationClayooLibrary"]

[[settings]]
key = "sd_faces"
type = "int"
option = "Faces"
label = "Số mặt mỗi cạnh"
default = 2
min = 1
max = 32
commands = ["ClayooPrimitivesBox", "ClayooPrimitivesSphere", "ClayooPrimitivesCylinder", "ClayooPrimitivesCone", "ClayooPrimitivesPlane"]

[[settings]]
key = "sd_sides"
type = "int"
option = "Sides"
label = "Số cạnh vòng"
default = 8
min = 3
max = 64
commands = ["ClayooPrimitivesCylinder", "ClayooPrimitivesCone", "ClayooPrimitivesTorus", "ClayooCreationPipe", "ClayooCreationRevolve"]

[[settings]]
key = "sd_stations"
type = "int"
option = "Stations"
label = "Số mặt dọc"
default = 12
min = 1
max = 400
commands = ["ClayooCreationPipe", "ClayooCreationSweep1Rail", "ClayooCreationSweep2Rails", "ClayooCreationLoft", "ClayooCreationFrom2Curves", "ClayooCreationFromSurface"]

[[settings]]
key = "sd_points"
type = "int"
option = "Points"
label = "Số điểm ngang"
default = 8
min = 2
max = 200
commands = ["ClayooCreationSweep1Rail", "ClayooCreationSweep2Rails", "ClayooCreationLoft", "ClayooCreationRevolve", "ClayooCreationFromCurve", "ClayooCreationFrom2Curves", "ClayooCreationFromSurface"]

[[settings]]
key = "sd_thickness"
type = "length"
option = "Thickness"
label = "Độ dày"
default = 1.0
min = 0.05
max = 50.0
step = 0.05
commands = ["ClayooCreationFromCurve", "ClayooCreationClayooLibrary"]

[[settings]]
key = "sd_library"
type = "enum"
option = "Shape"
label = "Hình"
