steps = ["Chọn Halo Builder.", "Chọn viên đá chủ (đá tạo bởi Gem Loader, Gem On Crv …).", "Chỉnh Size, Spacing, Offset … xem trước trực tiếp.", "Enter để tạo."]
options = ["Size: cỡ đá halo (mm).", "Spacing: khe giữa các viên halo.", "Offset: khoảng cách từ gờ đá chủ tới gờ đá halo.", "Height: nâng/hạ đá halo theo trục đá chủ.", "Rotation: xoay vị trí viên đầu tiên (độ).", "Angle: nghiêng đá halo ra ngoài (độ).", "Metal: tạo khung kim loại; ProfileHeight, Wall: chiều cao và độ dày thành khung."]

