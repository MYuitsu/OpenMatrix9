steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm tâm.", "Gõ bán kính và góc."]

[[commands]]
id = "TransformSoftMove"
label = "Soft Move"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["SoftMove"]
summary = "Dời mềm: điểm gần nhất dời hết, xa dần dời ít (theo bán kính)."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Gõ bán kính ảnh hưởng.", "Bấm điểm gốc và điểm đích."]

[[commands]]
id = "TransformSetPoints"
label = "Set Points"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["SetPt", "SetPoints"]
summary = "Đặt X, Y hoặc Z (theo CPlane) của mọi điểm của vật về cùng một giá trị."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bật X/Y/Z cần đặt.", "Bấm điểm lấy giá trị."]
options = ["X, Y, Z: trục được đặt."]

[[commands]]
id = "TransformProjecttoCPlane"
label = "Project To C-Plane"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["ProjectToCPlane"]
summary = "Ép phẳng vật lên CPlane."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Enter."]

[[commands]]
