interactive = true
mesh_data = true
aliases = ["Bend"]
summary = "Uốn cong vật theo một trục (gân), trục thành cung tròn cùng chiều dài."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm đầu và cuối trục uốn.", "Gõ góc uốn (về phía pháp tuyến CPlane)."]

[[commands]]
id = "TransformTaper"
label = "Taper"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["Taper"]
summary = "Vuốt nhỏ dần vật dọc một trục."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm đầu và cuối trục.", "Gõ tỉ lệ ở đầu và ở cuối."]

[[commands]]
id = "TransformTwist"
label = "Twist"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["Twist"]
summary = "Xoắn vật quanh một trục."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm đầu và cuối trục.", "Gõ góc xoắn ở cuối trục."]

[[commands]]
id = "TransformStretch"
label = "Stretch"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["Stretch"]
summary = "Kéo giãn vật dọc một trục."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm đầu và cuối trục.", "Bấm điểm kéo tới."]

[[commands]]
id = "TransformMaelstrom"
label = "Maelstrom"
handler = "om9_addon_session"
interactive = true
