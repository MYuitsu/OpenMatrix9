options = ["Stretch: kéo giãn kín vòng rail."]

[[commands]]
id = "gvSmartFlowRigid"
label = "Smart Flow Rigid"
handler = "om9_addon_session"
interactive = true
aliases = ["SmartFlowRigid"]
