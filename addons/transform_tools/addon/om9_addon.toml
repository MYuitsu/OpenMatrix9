interactive = true
mesh_data = true
aliases = ["Flow", "FlowAlongCurve"]
summary = "Uốn vật từ đường cong gốc sang đường cong đích."
steps = ["Chọn vật, đường gốc (gần vật) và đường đích.", "Enter."]
options = ["Stretch: kéo giãn theo chiều dài đường đích.", "Rigid: chỉ dời/xoay từng vật, không uốn."]

[[commands]]
id = "TransformFlowAlongSurface"
