# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_transform_tools"
version = "0.1.0"
name = "Transform Tools"
tagline = "Menu Transform kiểu Matrix: Orient, Bend, Flow, Smart Flow, Cage …"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Transform"]

[[commands]]
id = "TransformScaleNonUniformScale"
label = "Scale Non-Uniform"
handler = "om9_addon_session"
interactive = true
aliases = ["ScaleNU"]
summary = "Phóng to/thu nhỏ khác nhau theo X, Y và pháp tuyến CPlane."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm điểm gốc.", "Gõ hệ số X, Y, Z (Enter giữ 1)."]
options = ["Copy: giữ bản gốc."]

[[commands]]
id = "TransformScaleScaleByPlane"
label = "Scale by Plane"
handler = "om9_addon_session"
interactive = true
aliases = ["ScaleByPlane"]
summary = "Phóng to/thu nhỏ đều trong mặt CPlane, giữ chiều cao."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm điểm gốc.", "Gõ hệ số."]
options = ["Copy: giữ bản gốc."]

[[commands]]
id = "TransformOrient2Points"
label = "Orient 2 Points"
handler = "om9_addon_session"
interactive = true
aliases = ["Orient", "Orient2Pt"]
summary = "Đưa vật từ 2 điểm tham chiếu tới 2 điểm đích (dời + xoay, có thể co giãn)."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm 2 điểm tham chiếu.", "Bấm 2 điểm đích (xem trước khi rê chuột)."]
options = ["Copy: giữ bản gốc.", "Scale: co giãn theo khoảng cách."]

[[commands]]
id = "TransformOrient3Points"
label = "Orient 3 Points"
handler = "om9_addon_session"
interactive = true
aliases = ["Orient3Pt"]
summary = "Đưa vật từ 3 điểm tham chiếu tới 3 điểm đích."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm 3 điểm tham chiếu.", "Bấm 3 điểm đích."]
options = ["Copy, Scale."]

[[commands]]
id = "TransformShear"
label = "Shear"
handler = "om9_addon_session"
interactive = true
aliases = ["Shear"]
summary = "Xô nghiêng vật trong mặt CPlane theo một góc."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Bấm điểm gốc.", "Bấm điểm hướng xô.", "Gõ góc."]
options = ["Copy: giữ bản gốc."]

[[commands]]
id = "TransformSymmetry"
label = "Symmetry"
handler = "om9_addon_session"
interactive = true
aliases = ["Symmetry"]
summary = "Tạo bản đối xứng của vật qua trục X, Y của CPlane (hoặc cả hai)."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Chọn Axis.", "Bấm tâm đối xứng hoặc Enter để lấy gốc CPlane."]
options = ["Axis: X, Y, XY."]

[[commands]]
id = "TransformOrientRemaptoCPlane"
label = "Remap to CPlane"
handler = "om9_addon_session"
interactive = true
aliases = ["RemapCPlane"]
summary = "Đưa vật từ mặt phẳng Top của thế giới lên CPlane đang dùng."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Enter."]
options = ["Copy: giữ bản gốc."]

[[commands]]
id = "TransformMoveUVN"
label = "Move UVN"
handler = "om9_addon_session"
interactive = true
aliases = ["MoveUVN"]
summary = "Dời vật theo U, V (trục CPlane) và N (pháp tuyến) bằng giá trị gõ."
steps = ["Chọn vật cần biến đổi (hoặc chọn sau khi gọi lệnh, Enter).", "Gõ khoảng dời U, V, N."]
options = ["Copy: giữ bản gốc."]

[[commands]]
