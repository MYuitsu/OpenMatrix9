interactive = true
mesh_data = true
aliases = ["TransformSolidPoints"]
summary = "Bật điểm điều khiển của khối để sửa: bấm điểm, bấm chỗ mới, lặp lại."
steps = ["Chọn khối.", "Bấm điểm cần dời.", "Bấm (hoặc gõ) vị trí mới. Lặp lại.", "Enter."]
