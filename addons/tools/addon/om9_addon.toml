[[commands]]
id = "BuilderSurfaceInset"
label = "Surface Inset"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["SurfaceInset"]
summary = "Khoét lõm vùng trong đường cong kín trên mặt vật."
