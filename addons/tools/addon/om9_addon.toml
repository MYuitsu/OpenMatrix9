# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_tools"
version = "0.1.0"
name = "Tools"
tagline = "Menu Tools kiểu Matrix: ring rail, profile, smart target, trọng lượng, resize, thư viện, mesh, in 3D"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Tools"]

[[commands]]
id = "BuilderRingRail"
label = "Ring Rail"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["RingRail", "gvRingRail"]
summary = "Đặt ring rail (vòng ngón tay) theo cỡ nhẫn ở Front view."
steps = ["Chọn hệ cỡ và cỡ nhẫn.", "Enter."]

[[commands]]
id = "BuilderProfilePlacer"
label = "Profile Placer"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ProfilePlacer", "gvProfilePlacer"]
summary = "Đặt các profile kín lên ring rail (đỉnh, hai bên, đáy) để quét Sweep."
steps = ["Chọn ring rail (hoặc dùng cỡ).", "Chỉnh kiểu, rộng/cao từng vị trí.", "Enter."]

[[commands]]
id = "BuilderOutsideRingRail"
label = "Outside Ring Rail"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["OutsideRingRail"]
summary = "Tạo đường rail ngoài quanh ring rail theo độ dày đỉnh / bên / đáy (cho Sweep 2)."
steps = ["Chọn ring rail (hoặc dùng cỡ).", "Chỉnh độ dày.", "Enter."]

[[commands]]
id = "BuilderCustomRail"
label = "Custom Rail"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["CustomRail"]
summary = "Tạo rail 3D (bypass…) từ ring rail và đường dáng vẽ ở Top view."
steps = ["Chọn ring rail và đường dáng Top view.", "Enter."]
options = ["Mirror: thêm rail đối xứng."]

[[commands]]
id = "BuilderFourProfile"
label = "Four Rail Profile"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["FourRailProfile"]
summary = "Tạo profile kín đi qua bốn đường rail tại đường cắt bấm."
steps = ["Chọn bốn đường cong.", "Bấm đầu và cuối đường cắt."]
options = ["DeleteCurves: xoá đường gốc."]

[[commands]]
id = "BuilderMetalWeights"
label = "Metal Weights"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["MetalWeights"]
summary = "Tính thể tích và trọng lượng kim loại (vàng, bạch kim, bạc …) và cara đá."
steps = ["Chọn vật (và đá).", "Enter."]

[[commands]]
id = "BuilderResize"
label = "Ring Resizer"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["RingResizer", "Resize"]
summary = "Tạo các cỡ nhẫn khác từ nhẫn đã làm (giữ độ dày bản)."
steps = ["Chọn nhẫn (không chọn đá).", "Gõ cỡ gốc và danh sách cỡ mới.", "Enter."]

[[commands]]
id = "BuilderSurfacePullback"
label = "Surface Pullback"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["SurfacePullback"]
summary = "Kéo thiết kế phẳng (đường cong, lưới) lên mặt, giữ chiều cao theo pháp tuyến."
steps = ["Chọn thiết kế phẳng, Enter.", "Chọn mặt đích, Enter."]

[[commands]]
id = "BuilderBermarkLibrary"
label = "Settings Library"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["BermarkLibrary"]
summary = "Thư viện head / ổ đá tham số của OM9 (peg head, basket, cup)."
steps = ["Chọn loại và kích thước.", "Bấm vị trí."]

[[commands]]
id = "BuilderStullerFindingsLibrary"
label = "Findings Library"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["FindingsLibrary"]
summary = "Thư viện phụ kiện tham số của OM9 (chốt bông tai, bail, khoen, chặn, khoá)."
steps = ["Chọn loại và kích thước.", "Bấm vị trí."]

[[commands]]
id = "gvSmartTarget"
label = "Smart Target"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["SmartTarget"]
summary = "Tạo điểm blend và tay nắm hướng (dùng với Smart Blend)."
steps = ["Bấm điểm blend.", "Bấm hướng tay nắm."]

[[commands]]
id = "gvSmartTargetAdd"
label = "Smart Target Add"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["SmartTargetAdd"]
summary = "Thêm tay nắm vào điểm blend có sẵn."
steps = ["Chọn smart target.", "Bấm hướng mới."]

[[commands]]
id = "gvSmartTargetOnCrvEnd"
label = "Smart Target on Curve End"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["SmartTargetOnCrvEnd"]
summary = "Đặt smart target ở đầu đường cong, theo tiếp tuyến."
steps = ["Chọn đường cong.", "Bấm gần đầu cần đặt."]

[[commands]]
id = "gvSmartBlend"
label = "Smart Blend"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["SmartBlend"]
summary = "Nối hai smart target bằng đường cong mượt."
steps = ["Chọn hai smart target.", "Enter."]

[[commands]]
id = "gvSmartMSR"
label = "Smart MSR"
handler = "om9_addon_session"
interactive = true
aliases = ["SmartMSR"]
summary = "Dời / xoay / co các smart target quanh điểm blend của chúng."
steps = ["Chọn smart target, Enter.", "Gõ góc, tỉ lệ; bấm điểm dời."]

[[commands]]
id = "gvJoinHistory"
label = "Join"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["JoinHistory"]
summary = "Nối các đường cong chạm nhau thành một."
steps = ["Chọn đường cong.", "Enter."]

[[commands]]
id = "BuilderImageTrace"
label = "Image Trace"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ImageTrace"]
summary = "Dò ảnh (PNG, BMP, PGM) thành đường cong theo ngưỡng tối."
steps = ["Chọn tệp ảnh trong bảng BUILDERS.", "Chỉnh rộng, ngưỡng.", "Bấm góc dưới trái."]

[[commands]]
id = "BuilderObjectChecker"
label = "Object Checker"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["ObjectChecker"]
summary = "Kiểm tra vật: cạnh hở, không manifold, tam giác suy biến, thể tích, pháp tuyến."
steps = ["Chọn vật.", "Enter để xem báo cáo."]

[[commands]]
id = "BuilderMeshRepair"
label = "Mesh Repair"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["MeshRepair"]
summary = "Sửa lưới: hàn điểm, bỏ tam giác hỏng, lấp lỗ, lật pháp tuyến ra ngoài."
steps = ["Chọn lưới.", "Enter."]

[[commands]]
id = "Builder3dPrinting"
label = "3D Printing Supports"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["3dPrinting", "RingSupportSprue"]
summary = "Thêm sprue và đế đỡ để in 3D."
steps = ["Chọn vật.", "Chỉnh số sprue, đường kính.", "Enter."]

[[commands]]
id = "BuilderProfile"
label = "Profile"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["Profile"]
summary = "Đặt profile thư viện (phẳng, D, comfort, knife, tròn) ở Top view."
steps = ["Chọn kiểu, rộng, cao.", "Bấm vị trí."]

[[commands]]
id = "BuilderProfileMerge"
label = "Profile Merge"
handler = "om9_addon_session"
interactive = true
aliases = ["ProfileMerge"]
summary = "Gộp hai profile kín chồng nhau thành một."
steps = ["Chọn hai profile.", "Enter."]

[[commands]]
id = "BuilderProfileEndCap"
label = "Profile End Cap"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ProfileEndCap"]
summary = "Tạo nắp bo tròn ở đầu profile."
steps = ["Chọn profile kín.", "Chỉnh độ nhô.", "Enter."]
options = ["Flip: đảo chiều."]

[[commands]]
id = "BuilderCustomRailAdvanced"
label = "Custom Rail Advanced"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["CustomRailAdvanced"]
summary = "Custom rail từ hai đường dáng (Top và Side) hoà theo góc."
steps = ["Chọn ring rail, đường dáng Top và Side.", "Enter."]
options = ["Mirror."]

[[commands]]
id = "BuilderObjectOnCrv"
label = "Object on Curve"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ObjectOnCrv"]
