[[commands]]
id = "BuilderMeshReducer"
label = "Mesh Reducer"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["MeshReducer"]
summary = "Giảm số tam giác của lưới theo %."
steps = ["Chọn lưới.", "Chỉnh %.", "Enter."]

[[commands]]
id = "BuilderMesh"
label = "Mesh"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["Mesh"]
summary = "Đổi mặt / khối sang lưới."
steps = ["Chọn vật.", "Enter."]
options = ["DeleteInput: xoá vật gốc."]

[[commands]]
id = "BuilderCurveTransformTool"
label = "Curve Transform"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["CurveTransform"]
summary = "Uốn đường cong như dây: điểm giữ, điểm uốn, góc."
steps = ["Chọn đường cong.", "Chỉnh giữ, uốn, góc.", "Enter."]

[[commands]]
id = "BuilderCenterLine"
label = "Center Line"
handler = "om9_addon_session"
interactive = true
aliases = ["CenterLine"]
summary = "Đường giữa hai đường cong, hoặc chữ thập tâm của một đường kín."
