steps = ["Select curves and points to project, Enter.", "Select surfaces, polysurfaces and meshes to project onto, Enter."]
options = ["Loose=No: Yes chỉ dời điểm điều khiển.", "DeleteInput=No."]

[[commands]]
id = "CurveCurveFromObjectsIntersection"
label = "Intersection"
