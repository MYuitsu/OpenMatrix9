# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_curve_tools"
version = "0.1.0"
name = "Curve Tools"
tagline = "Menu Curve kiểu Matrix: blend, offset, fillet, chiếu, giao, mặt cắt …"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Curve"]

[[commands]]
id = "OthersCurveRebuild"
label = "Rebuild Curve"
handler = "om9_addon_session"
interactive = true
aliases = ["Rebuild", "RebuildCrv"]
summary = "Dựng lại đường cong với số điểm điều khiển và bậc mới (Rhino Rebuild): nút đều, giữ hai đầu, báo độ lệch lớn nhất."
steps = ["Select curves to rebuild, Enter.", "Chỉnh PointCount, Degree, DeleteInput (hoặc SelectMasterCurve để lấy theo đường mẫu); xem trước; Enter."]
options = ["PointCount=10: số điểm điều khiển.", "Degree=3: bậc (1–11).", "DeleteInput=Yes: thay đường gốc; No: tạo đường mới.", "SelectMasterCurve: chọn đường mẫu, lấy số điểm và bậc của nó (như -Rebuild của Rhino 5)."]

[[commands]]
id = "CurveCurveEditToolsRefitToTolerance"
label = "Refit to Tolerance"
handler = "om9_addon_session"
interactive = true
aliases = ["FitCrv", "Refit"]
summary = "Làm lại đường cong với ít điểm điều khiển nhất mà vẫn nằm trong dung sai (Rhino FitCrv)."
steps = ["Select curves to fit, Enter.", "Chỉnh DeleteInput, Degree, FittingTolerance; Enter."]
options = ["DeleteInput=Yes.", "Degree=3.", "FittingTolerance=0.001."]

[[commands]]
id = "CurveBlendCurvesBlendCurves"
label = "Quick Curve Blend"
handler = "om9_addon_session"
interactive = true
aliases = ["Blend", "QuickBlend"]
summary = "Nối nhanh hai đầu đường cong bằng đường chuyển tiếp (Rhino Blend): bấm gần đầu cần nối của mỗi đường."
steps = ["Select first curve near end: bấm đường thứ nhất gần đầu cần nối.", "Select second curve near end: bấm đường thứ hai; đường nối tạo ngay."]
options = ["Continuity1, Continuity2=Position/Tangency/Curvature cho từng đầu (mặc định Curvature), như Blend của Rhino 5."]

[[commands]]
id = "CurveBlendCurvesBlendCrv"
label = "Adjustable Curve Blend"
handler = "om9_addon_session"
interactive = true
aliases = ["BlendCrv", "AdjustableBlend"]
summary = "Nối chuyển tiếp chỉnh được (Rhino BlendCrv): chọn hai đầu, chỉnh độ liên tục và độ phình rồi Enter."
steps = ["Select first curve to blend - select near end.", "Select second curve to blend - select near end.", "Chỉnh Continuity1/2, Flip1/2, Bulge1/2, Join; xem trước; Enter."]
options = ["Continuity1/Continuity2=Position/Tangency/Curvature/G3/G4 (mặc định Curvature).", "Flip1/Flip2: đảo hướng ở đầu đó.", "Bulge1/Bulge2: độ phình (thay cho kéo điểm điều khiển).", "Join: nối đường nối với hai đường cong."]

[[commands]]
id = "CurveBlendCurvesArcBlend"
label = "Arc Blend"
handler = "om9_addon_session"
interactive = true
aliases = ["ArcBlend"]
summary = "Nối hai đầu đường cong bằng hai cung tròn tiếp xúc (Rhino ArcBlend)."
steps = ["Select first curve near end.", "Select second curve near end.", "Chỉnh tuỳ chọn, Enter."]
options = ["AlternateSolution: lấy lời giải dài hơn.", "RadiusDifference: chênh lệch bán kính hai cung (dạng chữ S).", "Join: nối với hai đường cong."]

[[commands]]
id = "CurveCurveFrom2Views"
label = "Curve from 2 Views"
handler = "om9_addon_session"
interactive = true
aliases = ["Crv2View"]
summary = "Dựng đường cong 3D từ hai đường ở hai góc nhìn (Rhino Crv2View)."
steps = ["Select first curve.", "Select second curve."]

[[commands]]
id = "BuilderCrv2ViewHistory"
label = "Curve from 2 Views Builder"
handler = "om9_addon_session"
interactive = true
aliases = ["Crv2ViewBuilder", "gvCrv2ViewHistory"]
summary = "Như Crv2View (bản Builder của Matrix)."
steps = ["Select first curve.", "Select second curve."]

