[package]
name = "om9-addon-top11"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 Matrix-style Top 11 toolbar: edit and control points, explode, join, split, trim, ring rail"
publish = false

[lib]
name = "om9_top11"

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
om9-addon-geom = { path = "../geom" }
om9-addon-surfaces = { path = "../surfaces" }
om9-addon-tools = { path = "../tools" }
serde = { workspace = true }
serde_json = { workspace = true }
