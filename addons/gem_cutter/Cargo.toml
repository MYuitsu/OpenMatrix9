[package]
name = "om9-addon-gem-cutter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 add-on: Matrix 9 Gem Cutter (gvAzureCutter) with builder panel and command-line options"
publish = false

[lib]
name = "gem_cutter"
crate-type = ["cdylib", "rlib"]

[features]
# Export the C symbols OM9 loads. Off when several add-ons are linked into one test binary.
default = ["export"]
export = []

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
serde_json = { workspace = true }
om9-addon-geom = { path = "../geom" }

[dev-dependencies]
om9-addons = { path = "../../crates/om9-addons", features = ["native"] }
