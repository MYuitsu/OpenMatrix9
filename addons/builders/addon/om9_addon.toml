# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_builders"
version = "0.1.0"
name = "Builders"
tagline = "Menu Builder kiểu Matrix: eternity, signet, nhẫn, chữ, dây, nút, hoa văn, mill work"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Builder"]

[[commands]]
id = "BuilderEternity"
label = "Eternity Band"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["Eternity", "gvEternity"]
summary = "Nhẫn eternity kênh: đá chạy quanh cả vòng, có kênh giữ đá và dao cắt cho từng viên."
steps = ["Chọn cỡ nhẫn, kiểu đá, kích thước (vd. 1.5 hoặc 1.5,1.2 xen kẽ).", "Chỉnh rộng, khoảng cách, phủ kênh, culet tới ngón.", "Enter."]

[[commands]]
id = "BuilderSignet"
label = "Signet"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["Signet", "gvSignet"]
summary = "Nhẫn signet: bản rộng và dày dần lên đỉnh, mặt trên phẳng."
steps = ["Chọn cỡ nhẫn.", "Chỉnh rộng/dày đáy và đỉnh, cao mặt phẳng.", "Enter."]

[[commands]]
id = "ClayooCreationSignetRing"
label = "SubD Signet"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ClayooSignet", "SubDSignet"]
summary = "Signet mềm (tiết diện bo tròn)."
steps = ["Chọn cỡ nhẫn.", "Chỉnh kích thước.", "Enter."]

[[commands]]
id = "ClayooCreationRing"
label = "SubD Ring"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ClayooRing", "SubDRing"]
summary = "Nhẫn trơn với tiết diện comfort / D / phẳng / knife / tròn."
steps = ["Chọn cỡ nhẫn, rộng, dày, tiết diện.", "Enter."]

[[commands]]
id = "TextOnCurve"
label = "Text on Curve"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["TextOnCurve"]
summary = "Chữ chạy theo đường cong: nằm trên CPlane hoặc đứng hướng ra ngoài; dạng nét hoặc khối."
steps = ["Chọn đường cong.", "Gõ chữ, cao, khoảng cách.", "Enter."]

[[commands]]
id = "BuilderRaised"
label = "Raised Band"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["RaisedBand"]
summary = "Nhẫn có phần đỉnh nhô cao (bản đỉnh rộng, vai và đáy mỏng dần)."
steps = ["Chọn cỡ nhẫn.", "Chỉnh đỉnh, vai, đáy.", "Enter."]

[[commands]]
id = "BuilderAwardRingBuilder"
label = "Award Ring Top"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["AwardRing"]
summary = "Tạo mặt nhẫn award (khối vát) đặt lên signet; có thể thêm đá giữa."
steps = ["Chọn signet (tuỳ chọn).", "Chỉnh kích thước X, Y, Z, vát.", "Enter."]

[[commands]]
id = "Builder_Rope"
label = "Rope"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["Rope"]
summary = "Dây xoắn: nhiều sợi xoắn theo đường cong (hoặc thành vòng nhẫn)."
steps = ["Chọn đường cong (hoặc không chọn để tạo vòng nhẫn).", "Chỉnh số sợi, dày sợi, bước xoắn.", "Enter."]

[[commands]]
id = "BuilderJump"
label = "Jump Ring"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["JumpRing"]
summary = "Khoen (jump ring) tròn / oval, dây tròn hoặc vuông."
steps = ["Chỉnh đường kính, dây, tỉ lệ, kiểu.", "Enter."]

[[commands]]
id = "BuilderFreeFormKnot"
label = "Freeform Knot"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["FreeformKnot"]
summary = "Biến đường cong tự cắt thành nút dây đan trên/dưới."
steps = ["Chọn đường cong (vẽ ở Top).", "Chỉnh rộng, dày, chiều cao vượt.", "Enter."]

[[commands]]
id = "BuilderKnot"
label = "Knot Builder"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["KnotBuilder"]
summary = "Nút Celtic (Lissajous) theo số cột / hàng."
steps = ["Chỉnh cột, hàng, kích thước.", "Bấm tâm nút."]

[[commands]]
id = "BuilderPatternBuilder"
label = "Pattern Builder"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["PatternBuilder"]
summary = "Lặp vật thể (vẽ trong tam giác gốc) thành ô vuông đối xứng rồi lưới X × Y."
steps = ["Chọn vật thể (quanh gốc CPlane).", "Chỉnh lặp X, Y, cỡ ô.", "Enter."]

[[commands]]
id = "BuilderNautilusBuilder"
label = "Nautilus Builder"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["Nautilus"]
summary = "Rải vật thể theo xoắn ốc nautilus, nhỏ dần."
steps = ["Chọn vật thể (ở gốc CPlane).", "Chỉnh số lượng, số vòng, bán kính, thu nhỏ.", "Enter."]

[[commands]]
id = "BuilderMillWork"
label = "Mill Work"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["MillWork"]
summary = "Dao cắt trang trí dọc đường cong: hạt (milgrain) hoặc rãnh V."
steps = ["Chọn đường cong.", "Chỉnh kiểu, cỡ, khoảng cách, sâu.", "Enter."]

[[commands]]
id = "BuilderMillArea"
label = "Mill Area"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["MillArea"]
summary = "Dao cắt rãnh V phủ vùng (florentine) trong đường cong kín."
steps = ["Chọn đường cong kín.", "Chỉnh khoảng cách, góc, đan chéo.", "Enter."]

[[commands]]
id = "BuilderMillWorkC"
label = "Mill Work Across"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["MillWorkC"]
summary = "Dao cắt khía ngang dọc đường cong (knurl)."
steps = ["Chọn đường cong.", "Chỉnh cỡ, khoảng cách.", "Enter."]

