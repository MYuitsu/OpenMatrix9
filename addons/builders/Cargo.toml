[package]
name = "om9-addon-builders"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 Matrix-style Builder menu: eternity, signet, raised and SubD rings, text on curve, rope, jump ring, knots, patterns, mill work"
publish = false

[lib]
name = "om9_builders"

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
om9-addon-geom = { path = "../geom" }
om9-addon-gem-cutter = { path = "../gem_cutter", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
