[package]
name = "om9-addon-cutters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 Matrix-style Cutters menu: Gem Cutter Library, Bezel, Channel, Micro Prong, Bright, Plane and Cube cutters …"
publish = false

[lib]
name = "om9_cutters"

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
om9-addon-geom = { path = "../geom" }
serde = { workspace = true }
serde_json = { workspace = true }
om9-addon-gem-cutter = { path = "../gem_cutter", default-features = false }
