# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_gem_tools"
version = "0.1.0"
name = "Gem Tools"
tagline = "Menu Gems kiểu Matrix: rải đá theo đường/mặt, pavé, cụm, baguette vát, style …"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Gems"]

[[commands]]
id = "BuilderGemOnCrvAdvanced"
label = "Gem on Curve Advanced"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["GemOnCrvAdvanced", "gvGemOnCrvAdvanced"]
summary = "Rải đá theo đường cong có lệch Y/Z, thu nhỏ dần, bám góc, hoặc rải bi / vật thể."
steps = ["Chọn đường cong (và một viên đá mẫu nếu muốn dùng đá đó).", "Chỉnh trong bảng BUILDERS: kiểu đá, kích thước, khoảng cách, vị trí, hướng.", "Enter để đặt đá."]
options = ["Mode: Gem / Sphere (bi) / Object (rải vật thể đặt ở gốc F4).", "SnapCorners: đặt đá ở các góc.", "Facing, Flip, TaperDiameter, TaperSpacing."]

[[commands]]
id = "BuilderGemListOnCrv"
label = "Gem List on Curve"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["GemListOnCrv"]
summary = "Rải lần lượt các viên đá đã chọn (đúng thứ tự, kích thước, kiểu) dọc đường cong."
steps = ["Chọn đường cong và các viên đá của danh sách.", "Chỉnh vị trí, khoảng cách, hướng, lệch.", "Enter."]
options = ["Direction: bắt đầu từ đầu hay cuối.", "Fill: lặp danh sách đến hết đường."]

[[commands]]
id = "BuilderGemOnCrvMulti"
label = "Gem on Curve Multi"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["GemOnCrvMulti"]
summary = "Rải nhiều hàng đá cùng lúc: đường thứ nhất quyết định vị trí, các đường còn lại thêm hàng."
steps = ["Chọn đường giữa trước, rồi các đường khác.", "Chỉnh kích thước, khoảng cách.", "Enter."]

[[commands]]
id = "BuilderGemProfile"
label = "Gem Profile"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["GemProfile"]
summary = "Tạo biên dạng (profile) bao quanh gờ đá, nằm trong mặt cắt đứng của đá."
steps = ["Chọn đá.", "Chỉnh cao, dày, lệch, kiểu.", "Enter."]

[[commands]]
id = "BuilderOrientToGem"
label = "Orient to Gem"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["OrientToGem", "gvOrientGems"]
summary = "Đặt và co giãn vật thể (dựng ở gốc F4 cho đá 10 mm) lên từng viên đá."
steps = ["Chọn các viên đá, Enter.", "Chọn vật thể, Enter."]
options = ["ScaleToGem: co theo kích thước đá."]

[[commands]]
id = "BuilderGemOnSurface"
label = "Gem on Surface"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["GemOnSurface"]
summary = "Bấm lên mặt để đặt từng viên đá, đá xoay theo pháp tuyến mặt."
steps = ["Chọn mặt.", "Bấm các điểm trên mặt (xem trước khi rê chuột).", "Enter để kết thúc."]
options = ["VerticalOffset, Angle, Flip, Spacing (vòng hướng dẫn), Copy."]

[[commands]]
id = "BuilderTaperBagChannel"
label = "Baguette Channel"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["TaperBagChannel"]
summary = "Rải baguette vát theo đường cong kênh: hai đầu vuông góc đường cong nên đá tự vát khi cong."
steps = ["Chọn đường tâm kênh.", "Chỉnh rộng, dài, khoảng cách.", "Enter."]

[[commands]]
id = "BuilderTaperBagBetweenTwoCurves"
label = "Tapered Baguette Between Two Curves"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["TaperBagBetweenTwoCurves"]
summary = "Lấp đầy khoảng giữa hai đường cong bằng các baguette vát."
steps = ["Chọn hai đường cong.", "Chỉnh số đá / chiều dài, khoảng cách.", "Enter."]

[[commands]]
id = "BuilderClusterBuilderOld"
label = "Cluster Builder"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ClusterBuilder"]
summary = "Tạo cụm đá: một viên giữa và 1–3 vòng đá quanh, nghiêng dần như hoa."
steps = ["Chọn viên đá giữa (hoặc bấm tâm cụm).", "Chỉnh số vòng, kích thước, độ nghiêng.", "Enter."]

[[commands]]
id = "BuilderPaveDialog"
label = "Auto Pavé"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["PaveDialog", "AutoPave"]
summary = "Lát pavé tự động trong đường cong kín (lưới lục giác), viên nhỏ dần ở mép, bám mặt nếu chọn."
steps = ["Chọn đường cong kín (và mặt cần lát).", "Chỉnh kích thước, tối thiểu, khoảng cách, lề, góc.", "Enter."]

[[commands]]
id = "BuilderPaveBuilder"
label = "Pavé Builder"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["PaveBuilder"]
summary = "Bấm từng viên trên mặt; mỗi viên tự thu nhỏ vừa khe với các viên bên cạnh."
steps = ["Chọn mặt (và đá đã có).", "Bấm điểm.", "Enter."]

[[commands]]
id = "BuilderPaveAzureBuilder"
label = "Pavé Azure Builder"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["PaveAzure"]
summary = "Tạo dao cắt azure (lỗ trang trí phía dưới) cho từng viên pavé."
steps = ["Chọn các viên pavé.", "Chỉnh tỉ lệ, sâu, góc, hình.", "Enter."]

[[commands]]
id = "BuilderPaveProngBuilder"
label = "Pavé Prong Builder"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["PaveProng"]
summary = "Đặt chấu chung cho pavé: một chấu giữa mỗi 3 viên kề nhau và chấu ở cạnh hở."
steps = ["Chọn các viên pavé.", "Chỉnh kích thước, cao, sâu.", "Enter."]

[[commands]]
id = "BuilderGemSprings"
label = "Gem Springs"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["GemSprings"]
summary = "Dãn đều các viên đá (như lò xo) để giữ khe đều nhau, vẫn bám mặt."
steps = ["Chọn đá (và mặt).", "Chỉnh khe, số lần, độ mạnh.", "Enter."]

[[commands]]
id = "BuilderGemFollow"
label = "Gem Follow"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["GemFollow"]
summary = "Xoay trục North của các viên theo hàng đá (dọc hoặc ngang hàng)."
steps = ["Chọn hàng đá.", "North=Along/Across.", "Enter."]

[[commands]]
id = "BuilderGemControl"
label = "Gem Control"
handler = "om9_addon_session"
interactive = true
aliases = ["GemControl"]
summary = "Hướng culet và/hoặc trục North của các viên về một điểm điều khiển."
steps = ["Chọn đá, Enter.", "Control=Culet/North/Both, Direction=Toward/Away.", "Bấm điểm điều khiển."]
options = ["Control, Direction."]

[[commands]]
id = "OthersMatchAttributes"
label = "Match Attributes"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["MatchAttributes", "gvMatchAttributes"]
summary = "Chép style (chấu, bezel, head, dao cắt) từ một viên sang các viên khác và dựng lại."
steps = ["Chọn các viên nhận style, Enter.", "Chọn viên có style, Enter."]

[[commands]]
id = "OthersSaveStyle"
label = "Save Style"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["SaveStyle"]
summary = "Lưu style của viên đá ra tệp .om9style."
steps = ["Chọn viên đá có style.", "Chọn ô (Slot) / thư mục.", "Enter."]

[[commands]]
id = "OthersLoadStyle"
label = "Load Style"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["LoadStyle"]
summary = "Nạp style từ tệp .om9style và dựng lên các viên đá đã chọn."
steps = ["Chọn đá.", "Chọn ô (Slot) / thư mục.", "Enter."]

[[commands]]
id = "BuilderGVDGemFlow"
label = "Gem Flow"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["GemFlow"]
summary = "Dời đá giữ nguyên hình (rigid) từ đường gốc sang đường đích."
steps = ["Chọn đá, đường gốc (trước) rồi đường đích.", "Enter."]
options = ["Copy, Stretch."]

[[commands]]
id = "BuilderGVDGemSplop"
label = "Gem Splop"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["GemSplop"]
summary = "Đặt nhóm đá (dựng quanh gốc F4) lên mặt tại các điểm bấm, đá bám mặt."
steps = ["Chọn đá, Enter.", "Chọn mặt, Enter.", "Bấm các điểm, Enter."]
options = ["Rotation, Scale."]

[[commands]]
id = "BuilderPaveSphere"
label = "Pavé Sphere"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["PaveSphere"]
summary = "Tạo quả cầu phủ pavé đều."
steps = ["Chỉnh bán kính, kích thước, khoảng cách.", "Bấm tâm cầu."]

[[commands]]
id = "BuilderGemPositioner"
label = "Gem Positioner"
handler = "om9_addon_session"
interactive = true
aliases = ["GemPositioner", "GemMSR"]
summary = "Dời / xoay / đổi kích thước từng viên theo trục riêng của viên đá."
steps = ["Chọn đá, Enter.", "Gõ dời X, Y, Z, góc xoay, % kích thước."]

[[settings]]
key = "goca_cut"
type = "enum"
option = "Cut"
label = "Kiểu cắt"
choices = ["round", "oval", "princess", "cushion", "emerald", "asscher", "baguette", "marquise", "pear", "heart", "trillion", "radiant", "cabochon_round", "cabochon_oval"]
choice_labels = ["Round", "Oval", "Princess", "Cushion", "Emerald", "Asscher", "Baguette", "Marquise", "Pear", "Heart", "Trillion", "Radiant", "Cabochon tròn", "Cabochon oval"]
default = "round"
commands = ["BuilderGemOnCrvAdvanced"]

[[settings]]
key = "goca_size"
type = "length"
option = "Size"
label = "Kích thước (dài / đường kính)"
default = 1.5
