[package]
name = "om9-addon-gem-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 Matrix-style Gems menu: layouts on curves and surfaces, pavé, clusters, layout editing, styles"
publish = false

[lib]
name = "om9_gem_tools"

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
om9-addon-geom = { path = "../geom" }
om9-addon-settings = { path = "../settings" }
om9-addon-gem-cutter = { path = "../gem_cutter", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
