# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_solid"
version = "0.1.0"
name = "Solid"
tagline = "Menu Solid kiểu Matrix: khối cơ bản, Boolean, đùn, lỗ, Shell …"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Solid"]

[[commands]]
id = "SolidUnion"
label = "Boolean Union"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["BooleanUnion", "Union"]
summary = "Gộp các khối thành một."
steps = ["Chọn hai khối trở lên.", "Enter."]

[[commands]]
id = "SolidDifference"
label = "Boolean Difference"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["BooleanDifference", "Difference"]
summary = "Trừ khối: chọn khối bị trừ, rồi chọn dao (khối trừ)."
steps = ["Chọn khối bị trừ, Enter.", "Chọn khối dùng để trừ, Enter."]

[[commands]]
id = "SolidIntersection"
label = "Boolean Intersection"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["BooleanIntersection"]
summary = "Giữ phần giao của hai nhóm khối."
steps = ["Chọn nhóm thứ nhất, Enter.", "Chọn nhóm thứ hai, Enter."]

[[commands]]
id = "SolidBooleanTwoObjects"
label = "Boolean Two Objects"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["BooleanTwoObjects"]
summary = "Boolean giữa đúng hai khối, chọn kiểu trên dòng lệnh, xem trước."
steps = ["Chọn hai khối.", "Mode=Union/Difference/Intersection/ReverseDifference.", "Enter."]
options = ["Mode: kiểu boolean."]

[[commands]]
id = "SolidCapPlanarHoles"
label = "Cap Planar Holes"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["Cap"]
summary = "Bịt kín các lỗ hở (mép hở) của khối."
steps = ["Chọn khối hở.", "Enter."]

[[commands]]
id = "SolidExtractSurface"
label = "Extract Surface"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["ExtractSrf"]
summary = "Tách một mặt (vùng mặt liền) ra khỏi khối."
steps = ["Chọn khối.", "Bấm lên mặt cần tách (nhìn từ trên CPlane)."]

[[commands]]
id = "SolidFilletEdgeFilletEdge"
label = "Fillet Edge"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["FilletEdge"]
summary = "Bo tròn các cạnh sắc của khối theo bán kính."
steps = ["Chọn khối.", "Gõ bán kính."]

[[commands]]
id = "SolidText"
label = "Text"
handler = "om9_addon_session"
builtin = true
interactive = true
builder = true
aliases = ["TextObject"]
summary = "Tạo chữ từ phông TrueType/OpenType đã cài: đường viền, mặt phẳng hoặc khối (như TextObject của Rhino 5)."
steps = ["Chọn tuỳ chọn ở bảng Text: chữ, phông (Bold/Italic), tạo Curves/Surfaces/Solids, cao, dày.", "Bấm điểm đặt chữ (xem trước chạy theo chuột)."]
options = ["Text: nội dung.", "Font, FontName, Bold, Italic: phông chữ đã cài trong Windows.", "Create: Curves / Surfaces / Solids.", "Height: cao chữ hoa.", "SolidThickness: dày khối.", "Spacing, SmallCaps: khoảng cách, chữ thường thành hoa nhỏ."]

[[commands]]
id = "SolidExtrudePlanarCurveStraight"
label = "Extrude Planar Curve"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["ExtrudeCrv"]
summary = "Đùn đường cong phẳng thành khối (kín) hoặc mặt (đường hở); đường nằm trong đường khác thành lỗ."
steps = ["Chọn đường cong.", "Gõ khoảng đùn."]
options = ["BothSides: đùn hai phía."]

[[commands]]
id = "SolidGVDAllExtrude"
label = "Extrude All"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["ExtrudeAll"]
summary = "Đùn tất cả đường cong đang chọn một lần (lỗ tự nhận)."
steps = ["Chọn các đường cong.", "Gõ khoảng đùn."]
options = ["BothSides."]

[[commands]]
id = "SolidPipe"
label = "Pipe"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Pipe"]
summary = "Tạo ống tròn theo đường cong."
steps = ["Chọn đường cong.", "Gõ bán kính."]

[[commands]]
id = "SolidBoxCornertoCornerHeight"
label = "Box"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Box"]
summary = "Tạo hộp theo hai góc đáy và chiều cao."
steps = ["Bấm góc đáy thứ nhất.", "Bấm góc đối diện.", "Gõ/bấm chiều cao."]

[[commands]]
id = "SolidSphereCenterRadius"
label = "Sphere"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Sphere"]
summary = "Tạo khối cầu."
steps = ["Bấm tâm.", "Gõ/bấm bán kính."]

[[commands]]
id = "SolidEllipsoidFromCenter"
label = "Ellipsoid"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Ellipsoid"]
summary = "Tạo khối elip."
steps = ["Bấm tâm.", "Gõ ba bán kính."]

[[commands]]
id = "SolidTorus"
label = "Torus"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Torus"]
summary = "Tạo xuyến (vòng)."
steps = ["Bấm tâm.", "Gõ bán kính tới tâm ống và bán kính ống."]

[[commands]]
id = "SolidCylinder"
label = "Cylinder"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Cylinder"]
summary = "Tạo khối trụ."
steps = ["Bấm tâm đáy.", "Gõ bán kính và chiều cao."]

[[commands]]
id = "SolidTube"
label = "Tube"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Tube"]
summary = "Tạo ống trụ rỗng."
steps = ["Bấm tâm đáy.", "Gõ bán kính ngoài, trong và chiều cao."]

[[commands]]
id = "SolidPyramid"
label = "Pyramid"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Pyramid"]
summary = "Tạo khối chóp đều."
steps = ["Bấm tâm đáy.", "Gõ bán kính tới đỉnh đáy và chiều cao."]
options = ["NumSides: số cạnh đáy."]

[[commands]]
id = "SolidCone"
label = "Cone"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["Cone"]
summary = "Tạo khối nón."
steps = ["Bấm tâm đáy.", "Gõ bán kính đáy và chiều cao."]

[[commands]]
id = "SolidTruncatedCone"
label = "Truncated Cone"
handler = "om9_addon_session"
builtin = true
interactive = true
aliases = ["TCone"]
summary = "Tạo khối nón cụt."
steps = ["Bấm tâm đáy.", "Gõ bán kính đáy, bán kính đỉnh và chiều cao."]

[[commands]]
id = "SolidBoss"
label = "Boss"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["Boss"]
summary = "Đùn một đường cong kín lên khối và gộp vào khối."
steps = ["Chọn khối và đường cong kín.", "Gõ chiều cao."]

[[commands]]
id = "SolidRib"
label = "Rib"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["Rib"]
summary = "Như Rib Rhino 5: làm dày đường cong phẳng rồi kéo tới mặt biên (Offset InCurvePlane/NormalToCurvePlane, Distance, Mode Straight/Tapered, DraftAngle)."
steps = ["Chọn đường cong phẳng và mặt biên (mặt hoặc khối).", "Đổi tuỳ chọn nếu cần, Enter."]

[[commands]]
id = "SolidSlab"
label = "Slab"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["Slab"]
summary = "Như Slab Rhino 5: offset đường cong (góc vát) rồi đùn lên (Distance, ThroughPoint, BothSides)."
steps = ["Chọn đường cong.", "Bấm phía offset.", "Chiều cao (gõ hoặc bấm)."]

[[commands]]
id = "SolidSolidEditToolsHolesMakeHole"
label = "Make Hole"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["MakeHole"]
summary = "Như MakeHole Rhino 5: khoét lỗ theo đường cong kín, tới điểm sâu hoặc xuyên qua (Direction, BothSides, DeleteInput)."
steps = ["Chọn các đường cong kín và khối.", "Bấm điểm độ sâu, gõ độ sâu, hoặc Enter để khoét xuyên."]

[[commands]]
id = "SolidSolidEditToolsHolesArrayHole"
label = "Array Hole"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["ArrayHole"]
summary = "Như ArrayHole Rhino 5: mảng lỗ theo hướng A, B (Rectangular, UseASpacing)."
steps = ["Chọn khối (hoặc khối và đường cong lỗ).", "Bấm lên mép lỗ có sẵn (Select a hole).", "Gõ số lỗ hướng A, hướng B.", "Bấm điểm gốc, hướng-khoảng A, hướng-khoảng B."]

[[commands]]
id = "SolidSolidEditToolsHolesArrayHolePolar"
label = "Array Hole Polar"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["ArrayHolePolar"]
summary = "Khoan mảng lỗ tròn quanh tâm."
steps = ["Chọn khối (hoặc khối và đường cong lỗ).", "Bấm lên mép lỗ có sẵn.", "Bấm tâm, gõ số lỗ và góc."]

[[commands]]
id = "SolidSolidEditToolsHolesMoveHole"
label = "Move Hole"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["MoveHole"]
summary = "Như MoveHole Rhino 5: dời lỗ (lấp chỗ cũ, khoét chỗ mới); Copy giữ lỗ cũ."
steps = ["Chọn khối (hoặc khối và đường cong lỗ).", "Bấm lên mép lỗ có sẵn.", "Bấm điểm dời từ và điểm dời tới."]

[[commands]]
id = "SolidSolidEditToolsFacesMoveFace"
label = "Move Face"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["MoveFace"]
summary = "Như MoveFace Rhino 5: dời một mặt của khối (DirectionConstraint None/Normal/ToBoundary, DeleteBoundary)."
steps = ["Chọn khối.", "Bấm lên mặt cần dời.", "Bấm điểm dời từ, điểm dời tới."]

[[commands]]
id = "SolidShell"
label = "Shell"
handler = "om9_addon_session"
builtin = true
interactive = true
mesh_data = true
aliases = ["Shell"]
summary = "Làm rỗng khối với thành dày đều."
steps = ["Chọn khối.", "Gõ độ dày thành."]

[[commands]]
id = "SolidPtOn"
label = "Solid Points On"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["SolidPtOnCmd"]
summary = "Bật điểm của khối (đỉnh lưới, điểm điều khiển NURBS) để sửa: bấm điểm, bấm chỗ mới, lặp lại."
steps = ["Chọn khối.", "Bấm điểm cần dời.", "Bấm (hoặc gõ) vị trí mới. Lặp lại.", "Enter."]

[[settings]]
key = "text_string"
type = "string"
option = "Text"
label = "Chữ cần tạo (\\n: xuống dòng)"
default = "OM9"
commands = ["SolidText"]

[[settings]]
key = "text_font"
type = "enum"
option = "Font"
label = "Phông chữ (Font)"
choices = ["Arial", "Arial Black", "Bahnschrift", "Calibri", "Cambria", "Candara", "Comic Sans MS", "Consolas", "Constantia", "Corbel", "Courier New", "Franklin Gothic Medium", "Gabriola", "Georgia", "Impact", "Lucida Console", "Palatino Linotype", "Segoe Print", "Segoe Script", "Segoe UI", "Tahoma", "Times New Roman", "Trebuchet MS", "Verdana"]
choice_labels = ["Arial", "Arial Black", "Bahnschrift", "Calibri", "Cambria", "Candara", "Comic Sans MS", "Consolas", "Constantia", "Corbel", "Courier New", "Franklin Gothic Medium", "Gabriola", "Georgia", "Impact", "Lucida Console", "Palatino Linotype", "Segoe Print", "Segoe Script", "Segoe UI", "Tahoma", "Times New Roman", "Trebuchet MS", "Verdana"]
default = "Arial"
commands = ["SolidText"]

[[settings]]
key = "text_font_other"
type = "string"
option = "FontName"
label = "Phông khác đã cài (để trống: dùng ô trên)"
default = ""
commands = ["SolidText"]

[[settings]]
key = "text_bold"
type = "bool"
option = "Bold"
label = "Đậm (Bold)"
default = false
commands = ["SolidText"]

[[settings]]
key = "text_italic"
type = "bool"
option = "Italic"
label = "Nghiêng (Italic)"
default = false
commands = ["SolidText"]

[[settings]]
key = "text_create"
type = "enum"
option = "Create"
label = "Tạo (Create)"
choices = ["curves", "surfaces", "solids"]
choice_labels = ["Đường cong (Curves)", "Mặt (Surfaces)", "Khối (Solids)"]
default = "solids"
commands = ["SolidText"]

[[settings]]
key = "text_height"
type = "length"
option = "Height"
label = "Cao chữ (Height)"
default = 3.0
min = 0.1
max = 500.0
step = 0.1
commands = ["SolidText"]

[[settings]]
key = "text_depth"
type = "length"
option = "SolidThickness"
label = "Độ dày khối (Solid thickness)"
default = 0.5
min = 0.01
max = 100.0
step = 0.05
commands = ["SolidText"]

[[settings]]
key = "text_spacing"
type = "length"
option = "Spacing"
label = "Thêm khoảng cách chữ (Add spacing)"
default = 0.0
min = -10.0
max = 50.0
step = 0.05
commands = ["SolidText"]

[[settings]]
key = "text_small_caps"
type = "bool"
option = "SmallCaps"
label = "Chữ thường thành hoa nhỏ (Lower case as small caps)"
default = false
commands = ["SolidText"]

[[settings]]
key = "text_small_caps_size"
type = "float"
option = "SmallCapsSize"
label = "Cỡ hoa nhỏ (%)"
default = 70.0
min = 10.0
max = 100.0
step = 5.0
commands = ["SolidText"]

[[settings]]
key = "sl_distance"
type = "length"
option = "Distance"
label = "Khoảng offset (Slab)"
default = 1.0
commands = ["SolidSlab"]

[[settings]]
key = "sl_height"
type = "length"
label = "Chiều cao (Slab)"
default = 1.0
commands = ["SolidSlab"]

[[settings]]
key = "rb_distance"
type = "length"
option = "Distance"
label = "Độ dày gân (Rib)"
default = 1.0
commands = ["SolidRib"]

[[settings]]
key = "rb_draft_angle"
type = "angle"
option = "DraftAngle"
label = "Góc vát (Rib, Tapered)"
default = 0.0
commands = ["SolidRib"]
