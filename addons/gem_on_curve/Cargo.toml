[package]
name = "om9-addon-gem-on-curve"
version = "0.4.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 add-on: Gem On Crv / Gem Count On Crv (native)"
publish = false

[lib]
name = "gem_on_curve"
crate-type = ["cdylib", "rlib"]

[features]
# Export the C symbols OM9 loads. Off when several add-ons are linked into one test binary.
default = ["export"]
export = []

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi" }

[dev-dependencies]
serde_json = { workspace = true }
om9-addons = { path = "../../crates/om9-addons", features = ["native"] }
