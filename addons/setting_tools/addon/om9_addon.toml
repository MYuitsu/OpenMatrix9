# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_setting_tools"
version = "0.1.0"
name = "Setting Tools"
tagline = "Menu Settings kiểu Matrix: SubD bezel, pull to rail, chấu / bi trên mặt, metal from gems"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Settings"]

[[commands]]
id = "ClayooCreationClayooBezel"
label = "SubD Bezel"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["ClayooBezel", "SubDBezel"]
summary = "Tạo bezel mềm (thành bo tròn) quanh đá; tự cắt phần chạm finger rail nếu chọn rail."
steps = ["Chọn đá (và finger rail nếu muốn cắt).", "Chỉnh cao, dày trên/dưới, góc, vị trí.", "Enter."]
options = ["Boolean: cắt theo finger rail."]

[[commands]]
id = "BuilderPullToRail"
label = "Pull Object to Rail"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["PullToRail", "gvPullToRail"]
summary = "Kéo phần dưới của head / vật thể xuống chạm finger rail, phần trên giữ nguyên."
steps = ["Chọn head / vật thể, Enter.", "Chọn finger rail, Enter."]
options = ["Zone: phần chiều cao bị kéo.", "Gap: khe hở với rail."]

[[commands]]
id = "BuilderProngEditor"
label = "Prong Editor"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["ProngEditor", "EditSingleProng"]
summary = "Sửa một chấu: đường kính, cao, vát, bo đầu, nghiêng."
steps = ["Chọn chấu.", "Chỉnh trong bảng BUILDERS.", "Enter."]

[[commands]]
id = "BuilderProngOnSurface"
label = "Prong on Surface"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["ProngOnSurface"]
summary = "Bấm lên mặt để đặt từng chấu theo pháp tuyến mặt."
steps = ["Chọn mặt.", "Bấm các điểm.", "Enter."]
options = ["Copy: đặt liên tục."]

[[commands]]
id = "BuilderBeadOnSurface"
label = "Bead on Surface"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["BeadOnSurface"]
summary = "Bấm lên mặt để đặt bi (hoặc vật thể dựng ở gốc F4)."
steps = ["Chọn mặt (và vật thể khi Mode=Object).", "Bấm các điểm.", "Enter."]
options = ["Mode: Bead / Object.", "Copy: đặt liên tục."]

[[commands]]
id = "BuilderMetalPiece"
label = "Metal from Gems"
handler = "om9_addon_session"
interactive = true
builder = true
mesh_data = true
aliases = ["MetalPiece", "gvMetalPiece"]
summary = "Tạo khối kim loại ôm hàng đá: thành ngoài, máng trong, nắp, dao cắt Top, góc tròn / nhọn."
steps = ["Chọn hàng (hoặc vòng) đá.", "Mode trong bảng BUILDERS.", "Enter."]
options = ["Mode: Outside / Inside / OutsideCenter / Top / RoundCorners / PinchedEnds."]

[[settings]]
key = "sdb_height"
type = "length"
option = "Height"
label = "Cao bezel (dưới gờ)"
default = 2.0
min = 0.2
max = 20.0
step = 0.05
commands = ["ClayooCreationClayooBezel"]

