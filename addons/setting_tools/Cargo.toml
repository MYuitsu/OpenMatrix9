license.workspace = true
rust-version.workspace = true
description = "OM9 Matrix-style Settings menu extras: SubD bezel, pull to rail, prongs and beads on surfaces, metal from gems, Boolean Builder"
publish = false

[lib]
name = "om9_setting_tools"

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
om9-addon-geom = { path = "../geom" }
serde = { workspace = true }
serde_json = { workspace = true }
