[package]
name = "om9-addon-surfaces"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OM9 Matrix-style Surface menu: sweeps, lofts, patches, revolves, blends, fillets, offsets and surface edits"
publish = false

[lib]
name = "om9_surfaces"

[dependencies]
om9-addon-abi = { path = "../../crates/om9-addon-abi", features = ["session"] }
om9-addon-geom = { path = "../geom" }
serde = { workspace = true }
serde_json = { workspace = true }
om9-addon-tools = { path = "../tools" }
