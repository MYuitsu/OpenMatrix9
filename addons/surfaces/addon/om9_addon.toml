# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_surfaces"
version = "0.1.0"
name = "Surfaces"
tagline = "Menu Surface kiểu Matrix: sweep, loft, patch, revolve, blend, fillet, offset …"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Surface"]

[[commands]]
id = "SurfaceSweepSweep1Rail"
label = "Sweep 1 Rail"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["Sweep1"]
summary = "Quét các profile dọc một đường ray (ray kín: nhẫn)."
steps = ["Chọn ray (đường dài nhất) và các profile.", "Enter."]

[[commands]]
id = "SurfaceSweepSweep2Rails"
label = "Sweep 2 Rails"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["Sweep2"]
summary = "Quét profile giữa hai đường ray, profile co giãn theo khoảng cách hai ray."
steps = ["Chọn hai ray và các profile.", "Enter."]
options = ["MaintainHeight: giữ chiều cao profile."]

[[commands]]
id = "SurfaceSweepProfileSweep"
label = "Profile Sweep"
handler = "om9_addon_session"
interactive = true
builder = true
aliases = ["ProfileSweep"]
